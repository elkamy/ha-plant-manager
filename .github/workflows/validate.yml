name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Lovelace card syntax
        run: node --check custom_components/plant_manager/www/plant-manager-card.js

      - name: Check manual-install card syntax
        run: node --check www/plant-manager-card.js

      - name: Check plant detail card syntax
        run: node --check custom_components/plant_manager/www/plant-manager-detail-card.js

      - name: Check manual-install detail card syntax
        run: node --check www/plant-manager-detail-card.js

      - name: Test Lovelace card rendering
        run: node --test tests/test_card.js tests/test_detail_card.js

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q custom_components/plant_manager tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate integration manifest
        run: python -m json.tool custom_components/plant_manager/manifest.json > /dev/null

      - name: Validate HACS metadata
        run: python -m json.tool hacs.json > /dev/null

  home-assistant:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Home Assistant test harness
        run: python -m pip install pytest-homeassistant-custom-component

      - name: Run tests in Home Assistant
        run: python -m pytest -q
