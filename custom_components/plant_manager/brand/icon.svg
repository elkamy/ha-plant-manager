<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Plant Manager</title>
  <!-- Single source of the Plant Manager emblem: the integration icon, the
       README banner and the list card header all use these shapes. -->
  <defs>
    <linearGradient id="pm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d27"/>
      <stop offset="1" stop-color="#1e5141"/>
    </linearGradient>
    <linearGradient id="pm-pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f2e8"/>
      <stop offset="1" stop-color="#cfe3d4"/>
    </linearGradient>
    <linearGradient id="pm-drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd3f7"/>
      <stop offset="1" stop-color="#2e8fd8"/>
    </linearGradient>
    <linearGradient id="pm-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9f2a1"/>
      <stop offset="1" stop-color="#55b879"/>
    </linearGradient>
  </defs>
  <rect id="pm-tile" width="256" height="256" rx="56" fill="url(#pm-bg)"/>
  <g id="pm-plant" transform="translate(20.3 -15.9) scale(.795)" fill="url(#pm-leaf)" stroke="#d8f7cb" stroke-width="2">
    <!-- Leaves scaled down around their base. -->
    <g transform="translate(111 214) scale(.8) translate(-111 -214)">
      <path d="M112 212C18 176 4 96 18 24c74 12 132 65 94 188Z"/>
      <path d="M113 214C91 128 111 55 180 12c35 70 10 145-67 202Z"/>
      <path d="M109 214C162 154 224 147 280 171c-35 65-94 83-171 43Z"/>
      <path d="M111 214C58 196 35 158 40 117c53 13 78 47 71 97Z"/>
      <path d="M110 215L42 64M111 214L177 53M112 215L250 183" fill="none" stroke="#e7ffe0" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- A flowerpot: a lip wider than the body, and a body tapering down. -->
    <g stroke="none">
      <path d="M60 228H164L152 304Q150 312 142 312H82Q74 312 72 304Z" fill="url(#pm-pot)"/>
      <path d="M61 233H163L162 241H62Z" fill="#a9cbb2" opacity=".55"/>
      <rect x="50" y="212" width="124" height="22" rx="7" fill="#f4faf4"/>
    </g>
  </g>
  <!-- A water drop: the plant's soil moisture. -->
  <g id="pm-drop-mark" transform="translate(198 62)">
    <path d="M0-30C11-14 20-4 20 8A20 20 0 0 1-20 8C-20-4-11-14 0-30Z" fill="url(#pm-drop)" stroke="#d6f1fd" stroke-width="2"/>
    <ellipse cx="-7" cy="6" rx="4.5" ry="7" fill="#ffffff" opacity=".6"/>
  </g>
</svg>
